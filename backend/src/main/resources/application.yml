spring:
  application:
    name: ticket-service
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:file:./data/tickets;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}

app:
  cors:
    allowed-origins: http://localhost:3000
  rag:
    top-k: ${APP_RAG_TOP_K:5}
    similarity-threshold: ${APP_RAG_SIMILARITY_THRESHOLD:0.65}
    vector-store-path: ./data/vector-store.json
    persist-on-shutdown: true

server:
  port: 8080
